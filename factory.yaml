# What the factory may do. Agents never read or write this file; changing it is a human PR.
repo: ""                       # owner/name, set to use GitHub; empty means local tickets in .factory/tickets/
base_branch: main
trigger_label: factory
approval_label: factory-approved   # only people with triage rights can add labels, so this is the human gate
trusted_authors: [NtaylorOX]       # tickets from anyone else wait for the approval label
trusted_reviewers: [NtaylorOX]     # only their review comments feed the learning loop

workspace_scope: ["demo_app/*"]    # the coder can write here and nowhere else
protected_paths:                   # never written by an agent, even with approval
  - ".github/*"
  - "agents/*"
  - "src/*"
  - "factory.yaml"
  - "pyproject.toml"
  - "uv.lock"
  - "Makefile"
  - ".env*"
gate_paths: ["demo_app/auth*", "demo_app/requirements*"]   # writable, but a human approves the plan first
gate_keywords: [password, secret, token, credential, auth, delete all, payment, dependency]

verify_commands:                   # the orchestrator runs these itself; the coder only edits files
  - ["{python}", -m, pytest, demo_app/tests, -q, -p, no:cacheprovider]   # {python} = the factory's interpreter
  - ["{python}", -m, ruff, check, --no-cache, demo_app]
max_code_attempts: 2
max_diff_lines: 400

backend: mock                      # mock | litellm | claude-code
models:
  default: claude-sonnet           # a LiteLLM alias (litellm_config.yaml); for claude-code use e.g. claude-sonnet-5-5
  qa: claude-haiku
  retro: claude-sonnet
qa_app: demo_app.app:app
auto_merge_lessons: false
