[project]
name = "efficient-software-factory"
version = "0.1.0"
description = "A small, readable software factory: GitHub issues in, reviewed pull requests out, with agents that never hold credentials."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
qa = ["playwright>=1.48"]

[project.scripts]
factory = "software_factory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S603", "S607"]  # subprocess use is deliberate and goes through sandbox.run

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"demo_app/tests/**" = ["S101"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["api: calls a paid or remote model API", "browser: needs Chromium + playwright", "slow: slow test"]
addopts = "-q -m 'not api'"
